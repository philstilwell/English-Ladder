name: English Ladder Offline Publication Checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cron.yml'
      - '.agents/skills/english-ladder-daily-producer/**'
      - '*.py'
      - '*.js'
      - '*.cjs'
      - '*.css'
      - 'package*.json'
      - 'archive/lessons/**'
      - 'assets/news/**'
      - 'cloudflare/**'
      - '**/*.html'
      - 'pdf/**'
      - 'prompts/**'
      - 'data/**'
      - 'content/**'
      - 'sitemaps/**'
      - 'requirements.txt'
      - 'tests/**'
      - 'wrangler.jsonc'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Run tests and verify the current saved edition; never generate content'
        required: false
        type: boolean
        default: true
      test_email:
        description: 'Send a clearly labeled test alert only; never generate content'
        required: false
        type: boolean
        default: false

concurrency:
  group: english-ladder-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_and_verify:
    name: Test saved content and verify publishing
    if: github.event.inputs.test_email != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact saved revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install browser-check dependencies
        run: npm ci --ignore-scripts

      - name: Prove the workflow is offline-only
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/cron.yml').read_text()
          forbidden = [
              'GEMINI' + '_API_KEY',
              'OPENAI' + '_API_KEY',
              'generate_' + 'daily_lessons',
              'ensure_' + 'daily_image',
              'vocabulary_' + 'translations.py --budget',
          ]
          found = [value for value in forbidden if value in workflow]
          if found:
              raise SystemExit('The offline publication workflow contains a model-generation path.')
          PY

      - name: Compile Python
        run: python -m py_compile update_site.py lesson_model.py lesson_evidence.py lesson_checkpoint.py lesson_run.py plan_daily.py plan_daily_runner.py daily_images.py daily_publication.py verify_discover.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run JavaScript static checks
        run: npm run check:js

      - name: Run Node browser tests
        run: node --test tests/*.test.cjs

      - name: Audit the generated site
        run: python audit_site.py

      - name: Require a complete saved daily edition
        if: github.event_name == 'workflow_dispatch'
        run: python daily_publication.py --require-published

      - name: Package expected public files
        if: github.event_name == 'push'
        run: node cloudflare/build.cjs

      - name: Wait for Cloudflare publishing
        if: github.event_name == 'push'
        timeout-minutes: 17
        # Explicit Bash enables pipefail, so tee cannot hide verifier failures.
        shell: bash
        run: |
          python -u cloudflare/verify-publishing.py https://englishladder.philstilwell.workers.dev \
            --report "${RUNNER_TEMP}/publishing-report.json" \
            2>&1 | tee "${RUNNER_TEMP}/publishing-manifest.log"

      - name: Verify current lesson on Cloudflare
        if: github.event_name == 'push'
        shell: bash
        run: |
          node cloudflare/verify-current-lesson.cjs https://englishladder.philstilwell.workers.dev \
            2>&1 | tee "${RUNNER_TEMP}/publishing-current-lesson.log"

      - name: Verify current lesson on public domain
        if: github.event_name == 'push'
        shell: bash
        run: |
          ALLOW_PUBLIC_EDGE_BLOCK=1 node cloudflare/verify-current-lesson.cjs https://englishladder.com \
            2>&1 | tee "${RUNNER_TEMP}/publishing-public-domain.log"

      - name: Retain publishing diagnostics
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: offline-publishing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publishing-*.json
            ${{ runner.temp }}/publishing-*.log
            .cf-site/deployment.json
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true

  test_email:
    name: Test the email connection
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_email == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Send a labeled test email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_SECURITY: starttls
          SMTP_USERNAME: philstilwell@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: philstilwell@gmail.com
          ALERT_TO: philstilwell@gmail.com
        run: python3 failure_alert.py --test
