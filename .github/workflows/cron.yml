name: Daily ESL Lesson Generator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cron.yml'
      - 'wrangler.jsonc'
      - 'cloudflare/**'
      - '**/*.html'
      - 'pdf/**'
      - 'prompts/**'
      - 'data/**'
      - 'content/**'
      - 'update_site.py'
      - 'daily_images.py'
      - 'verify_discover.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'styles.css'
      - 'app.js'
      - 'index.html'
      - 'editorial.py'
      - 'editorial.css'
      - 'learning.js'
      - 'site.js'
      - 'site.css'
      - 'site_quality.py'
      - 'ai_extensions.py'
      - 'ai-practice.js'
      - 'news_quality.py'
      - 'lesson_levels.py'
      - 'publish_snapshot.py'
      - 'audit_site.py'
      - 'audit_seo.py'
      - 'seo.py'
      - 'seo_lessons.py'
      - 'seo_content.py'
      - 'seo.css'
      - 'work_ready_prompts.py'
      - 'work-ready.js'
      - 'work-ai.css'
      - 'generate_efsp_web_pages.py'
      - 'story_lessons.py'
      - 'assets/editorial/**'
  schedule:
    # Primary daily run at 10:00 UTC, with later no-op fallbacks if the
    # GitHub-hosted runner pool fails before the job starts.
    - cron: '0 10 * * *'
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Rebuild existing pages and verify hosting without generating lessons or images'
        required: false
        type: boolean
        default: false
      release_date:
        description: 'Optional backfill release date in YYYY-MM-DD format'
        required: false
        type: string
      refresh_feature:
        description: 'Only create a missing image for the latest lesson and rebuild Discover (no new lesson text)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-esl-lesson-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This gives the action permission to save files to your repo
      
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          # A delayed schedule must see archives/images saved by an earlier run,
          # not the older commit that was current when GitHub queued this job.
          ref: ${{ github.ref_name }}
        continue-on-error: true

      - name: Fallback checkout
        if: steps.checkout.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "actions/checkout failed; attempting manual checkout fallback."
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            echo "Manual checkout attempt ${attempt}..."
            if git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}" \
              && git checkout --force -B "${GITHUB_REF_NAME}" FETCH_HEAD; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Manual checkout fallback failed after 3 attempts." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node for interaction checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check learning interactions
        run: |
          npm ci --ignore-scripts
          npm run check:js
          node --test tests/*.test.cjs

      - name: Run checks
        run: |
          python -m py_compile update_site.py daily_images.py verify_discover.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Run Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELEASE_DATE: ${{ github.event.inputs.release_date || '' }}
          SKIP_EXISTING: ${{ github.event_name == 'schedule' && '1' || '' }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_ONLY: ${{ github.event.inputs.deploy_only || 'false' }}
          REFRESH_FEATURE: ${{ github.event.inputs.refresh_feature || 'false' }}
        run: |
          if [ "${EVENT_NAME}" = "push" ] || [ "${DEPLOY_ONLY}" = "true" ]; then
            python update_site.py --refresh-pages
            exit 0
          fi
          if [ "${REFRESH_FEATURE}" = "true" ]; then
            python update_site.py --refresh-feature
            exit 0
          fi
          args=()
          if [ -n "${RELEASE_DATE}" ]; then
            args+=(--release-date "${RELEASE_DATE}")
          fi
          if [ -n "${SKIP_EXISTING}" ]; then
            args+=(--skip-existing)
          fi
          python update_site.py "${args[@]}"

      - name: Check generated pages
        run: |
          python audit_site.py
          python audit_seo.py

      - name: Commit updated lesson pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          lesson_snapshot="$(mktemp -d)"
          python publish_snapshot.py capture "${lesson_snapshot}"

          for attempt in 1 2 3; do
            echo "Preparing lesson update push attempt ${attempt}..."
            git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python publish_snapshot.py restore "${lesson_snapshot}"
            python update_site.py --refresh-pages
            python audit_site.py
            python audit_seo.py
            git add -- '*.html' archive assets/news lesson-data.json sitemap.xml sitemaps content/seo-index.json robots.txt
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            # GITHUB_TOKEN pushes do not start another GitHub Actions run.
            # Keep this commit visible to the Cloudflare GitHub integration.
            git commit -m "Auto-update daily lessons"
            if git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying after refreshing ${GITHUB_REF_NAME}..."
            sleep $((attempt * 5))
          done

          echo "Failed to push lesson update after 3 attempts." >&2
          exit 1

      - name: Verify Cloudflare publishing
        run: |
          node cloudflare/build.cjs
          python cloudflare/verify-publishing.py https://englishladder.philstilwell.workers.dev
          node cloudflare/verify.cjs https://englishladder.philstilwell.workers.dev
          node cloudflare/verify.cjs https://englishladder.com
