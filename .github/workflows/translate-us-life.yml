name: Translate Everyday English explanations

on:
  workflow_dispatch:
    inputs:
      include_audio:
        description: 'Generate missing Everyday English pronunciation files using Google cloud speech (up to $2)'
        required: false
        type: boolean
        default: false
      review_audio:
        description: 'Independently transcribe saved recordings; shares the $2 audio cap'
        required: false
        type: boolean
        default: false
      audio_limit:
        description: 'Optional audio pilot count; 0 prepares all missing terms'
        required: false
        type: number
        default: 0
      audio_model:
        description: 'Google speech model; existing valid recordings are retained'
        required: false
        type: choice
        options:
          - gemini-2.5-flash-preview-tts
          - gemini-3.1-flash-tts-preview
          - gemini-2.5-pro-preview-tts
          - gemini-3.8-flash-lite-tts
        default: gemini-3.8-flash-lite-tts
      audio_batch_size:
        description: '1 for individual requests, or 2–8 terms per recording with checked silent boundaries'
        required: false
        type: number
        default: 8
      include_vocabulary:
        description: 'Also fill missing languages across the retained news archive and evergreen stories (up to $5)'
        required: false
        type: boolean
        default: false
      budget_key:
        description: 'Cumulative spending record; reuse the same key when retrying (Everyday English cap $2)'
        required: false
        type: string
        default: initial

permissions:
  contents: write

concurrency:
  group: translate-us-life
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing project dependencies
        run: pip install -r requirements.txt
      - name: Publish authored Everyday English content before reviewing explanations
        run: python -c 'from editorial import decorate_page, ROOT; decorate_page(ROOT / "us-life.html")'
      - name: Prepare MP3 conversion
        if: github.event.inputs.include_audio == 'true'
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Create and save reusable pronunciation recordings
        if: github.event.inputs.include_audio == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_KEY: ${{ github.event.inputs.budget_key || 'initial' }}
          AUDIO_LIMIT: ${{ github.event.inputs.audio_limit || '0' }}
          AUDIO_MODEL: ${{ github.event.inputs.audio_model || 'gemini-3.8-flash-lite-tts' }}
          AUDIO_BATCH_SIZE: ${{ github.event.inputs.audio_batch_size || '8' }}
        run: |
          command -v ffmpeg
          if [ "$AUDIO_BATCH_SIZE" = 1 ]; then
            python -u us_life_audio.py --budget 2 --budget-key "$BACKFILL_KEY" --limit "$AUDIO_LIMIT" --model "$AUDIO_MODEL"
          else
            python -u us_life_audio_batch.py --budget 2 --budget-key "$BACKFILL_KEY" --limit "$AUDIO_LIMIT" --model "$AUDIO_MODEL" --batch-size "$AUDIO_BATCH_SIZE"
          fi
      - name: Fill and separately review missing vocabulary languages
        if: github.event.inputs.include_vocabulary == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_KEY: ${{ github.event.inputs.budget_key || 'initial' }}
        run: python -u vocabulary_translations.py --all --budget 5 --budget-key "$BACKFILL_KEY"
      - name: Translate and separately edit the public sidebars
        if: ${{ !cancelled() }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_KEY: ${{ github.event.inputs.budget_key || 'initial' }}
        run: python -u us_life_translations.py --budget 2 --budget-key "$BACKFILL_KEY"
      - name: Independently check spoken vocabulary
        if: github.event.inputs.review_audio == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_KEY: ${{ github.event.inputs.budget_key || 'initial' }}
        run: python -u us_life_audio_review.py --budget 2 --budget-key "$BACKFILL_KEY"
      - name: Preserve translations and spending records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-translations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/us-life-translations/
            data/vocabulary-translations/
            assets/audio/us-life/
            content/us-life-audio.json
            content/.audio-usage-*.json
            content/audio-batches/
          include-hidden-files: true
          retention-days: 14
      - name: Save reviewed translations and resumable progress
        if: always()
        env:
          GH_TOKEN: ${{ secrets.LESSON_PUBLISH_TOKEN || github.token }}
        run: |
          gh auth setup-git --hostname github.com
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add data/us-life-translations data/vocabulary-translations
          if [ -d assets/audio/us-life ]; then git add assets/audio/us-life; fi
          git add content/
          # This derived preview may have missing sidebars until the review finishes.
          # Rebuild it after fetching the completed records; do not publish it here.
          git restore us-life.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare reviewed language additions and save translation progress'
          # A branch backfill must stay on that branch until its pages are checked.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
