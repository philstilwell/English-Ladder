name: Daily ESL Lesson Generator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cron.yml'
      # Cover all shared generators and browser behavior, including newly added files.
      - '*.py'
      - '*.js'
      - '*.cjs'
      - '*.css'
      - 'package*.json'
      - 'archive/lessons/**'
      - 'wrangler.jsonc'
      - 'cloudflare/**'
      - '**/*.html'
      - 'pdf/**'
      - 'prompts/**'
      - 'data/**'
      - 'content/**'
      - 'update_site.py'
      - 'daily_images.py'
      - 'verify_discover.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'styles.css'
      - 'app.js'
      - 'index.html'
      - 'editorial.py'
      - 'editorial.css'
      - 'learning.js'
      - 'site.js'
      - 'site.css'
      - 'site_quality.py'
      - 'reading_layout.py'
      - 'ai_extensions.py'
      - 'ai-practice.js'
      - 'news_quality.py'
      - 'lesson_levels.py'
      - 'lesson_evidence.py'
      - 'lesson_checkpoint.py'
      - 'lesson_run.py'
      - 'generation_retry.py'
      - 'vocabulary_translations.py'
      - 'us_life_translations.py'
      - 'us_life_language_ui.py'
      - 'us-life.js'
      - 'workflow_checkpoint.py'
      - 'publish_snapshot.py'
      - 'audit_site.py'
      - 'audit_seo.py'
      - 'seo.py'
      - 'seo_lessons.py'
      - 'seo_content.py'
      - 'seo.css'
      - 'work_ready_prompts.py'
      - 'work-ready.js'
      - 'work-ai.css'
      - 'generate_efsp_web_pages.py'
      - 'story_lessons.py'
      - 'assets/editorial/**'
  schedule:
    # Later runs resume saved progress, or only retry a missing illustration
    # when this date's complete edition has already been published.
    # Avoid the top of the hour because GitHub may delay or drop scheduled
    # workflows during peak load then.
    - cron: '17 10 * * *'
    - cron: '43 13 * * *'
    - cron: '29 16 * * *'
  workflow_dispatch:
    inputs:
      translate_recent:
        description: 'Refresh missing recent vocabulary translations only; no new lessons or images ($0.30 cumulative daily cap)'
        required: false
        type: boolean
        default: false
      translate_archive:
        description: 'Fill missing reviewed vocabulary translations; no new lessons or images ($10 cumulative initial budget)'
        required: false
        type: boolean
        default: false
      deploy_only:
        description: 'Rebuild existing pages and verify hosting without generating lessons or images'
        required: false
        type: boolean
        default: false
      release_date:
        description: 'Optional backfill release date in YYYY-MM-DD format'
        required: false
        type: string
      refresh_feature:
        description: 'Only create a missing image for the latest lesson and rebuild Discover (no new lesson text)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-esl-lesson-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Generate and save checked lessons
    outputs:
      publishing_revision: ${{ steps.saved_revision.outputs.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # This gives the action permission to save files to your repo
      actions: read # Restore checkpoints from this workflow's earlier runs.
      
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          # A delayed schedule must see archives/images saved by an earlier run,
          # not the older commit that was current when GitHub queued this job.
          ref: ${{ github.ref_name }}
        continue-on-error: true

      - name: Fallback checkout
        if: steps.checkout.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "actions/checkout failed; attempting manual checkout fallback."
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            echo "Manual checkout attempt ${attempt}..."
            if git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}" \
              && git checkout --force -B "${GITHUB_REF_NAME}" FETCH_HEAD; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Manual checkout fallback failed after 3 attempts." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node for interaction checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check learning interactions
        run: |
          npm ci --ignore-scripts
          npm run check:js
          node --test tests/*.test.cjs

      - name: Run checks
        run: |
          python -m py_compile update_site.py lesson_evidence.py lesson_checkpoint.py lesson_run.py generation_retry.py workflow_checkpoint.py daily_images.py verify_discover.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Resolve daily release date
        if: github.event_name != 'push' && github.event.inputs.deploy_only != 'true' && github.event.inputs.refresh_feature != 'true' && github.event.inputs.translate_archive != 'true' && github.event.inputs.translate_recent != 'true'
        env:
          REQUESTED_RELEASE_DATE: ${{ github.event.inputs.release_date || '' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone, date
          from pathlib import Path
          requested = os.environ.get('REQUESTED_RELEASE_DATE') or datetime.now(timezone.utc).date().isoformat()
          release = date.fromisoformat(requested).isoformat()
          needed = not Path(f'archive/lessons/{release}.json').exists()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_DATE={release}\nLESSON_GENERATION_NEEDED={int(needed)}\n')
              output.write(f"LESSON_STATE_DIR={os.environ['RUNNER_TEMP']}/lesson-state\n")
          print(f'Daily release: {release}; new lesson text needed: {needed}')
          PY

      - name: Restore unfinished daily edition
        if: env.LESSON_GENERATION_NEEDED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python workflow_checkpoint.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --date "$RELEASE_DATE" --directory "$LESSON_STATE_DIR" --current-run-id "$GITHUB_RUN_ID"

      - name: Run Python Script
        # Leave time to upload saved progress even when a provider stays slow.
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_ONLY: ${{ github.event.inputs.deploy_only || 'false' }}
          REFRESH_FEATURE: ${{ github.event.inputs.refresh_feature || 'false' }}
          TRANSLATE_ARCHIVE: ${{ github.event.inputs.translate_archive || 'false' }}
          TRANSLATE_RECENT: ${{ github.event.inputs.translate_recent || 'false' }}
          LESSON_DIAGNOSTICS_DIR: ${{ runner.temp }}/lesson-diagnostics
        run: |
          if [ "${EVENT_NAME}" = "push" ] || [ "${DEPLOY_ONLY}" = "true" ] || [ "${TRANSLATE_ARCHIVE}" = "true" ] || [ "${TRANSLATE_RECENT}" = "true" ]; then
            python update_site.py --refresh-pages
            exit 0
          fi
          if [ "${REFRESH_FEATURE}" = "true" ]; then
            python update_site.py --refresh-feature
            exit 0
          fi
          # Repeating a manual or scheduled run must not overwrite a complete edition.
          args=(--skip-existing)
          if [ -n "${RELEASE_DATE}" ]; then
            args+=(--release-date "${RELEASE_DATE}")
          fi
          python -u update_site.py "${args[@]}"

      - name: Prepare reviewed vocabulary translations
        if: github.event_name != 'push' && github.event.inputs.deploy_only != 'true' && github.event.inputs.refresh_feature != 'true'
        id: translations
        timeout-minutes: 40
        # Translation trouble must never block the English lesson. Save partial work below.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATE_ARCHIVE: ${{ github.event.inputs.translate_archive || 'false' }}
        run: |
          if [ "${TRANSLATE_ARCHIVE}" = "true" ]; then
            python -u vocabulary_translations.py --all --budget 10 --budget-key initial-backfill
          else
            # Include the latest three editions to recover a recent service outage.
            python -u vocabulary_translations.py --budget 0.30
          fi

      - name: Retain vocabulary translation progress
        if: always() && steps.translations.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-translations-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/vocabulary-translations/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Refresh translated definitions
        if: steps.translations.outcome == 'success' || steps.translations.outcome == 'failure'
        run: python update_site.py --refresh-pages

      - name: Retain unfinished daily edition
        if: always() && env.LESSON_GENERATION_NEEDED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: lesson-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lesson-state/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain lesson review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lesson-diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Check generated pages
        run: |
          python audit_site.py
          python audit_seo.py

      - name: Commit updated lesson pages
        env:
          # External deploy integrations do not reliably receive pushes made
          # with GitHub's built-in workflow token. Use the repository's
          # publishing token for lesson commits so Cloudflare sees an ordinary
          # branch update; fall back only for local copies without the secret.
          GH_TOKEN: ${{ secrets.LESSON_PUBLISH_TOKEN || github.token }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          lesson_snapshot="$(mktemp -d)"
          python publish_snapshot.py capture "${lesson_snapshot}"

          for attempt in 1 2 3; do
            echo "Preparing lesson update push attempt ${attempt}..."
            git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python publish_snapshot.py restore "${lesson_snapshot}"
            python update_site.py --refresh-pages
            python audit_site.py
            python audit_seo.py
            git add -- '*.html' archive assets/news data/vocabulary-translations lesson-data.json sitemap.xml sitemaps content/seo-index.json robots.txt
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            # GITHUB_TOKEN pushes do not start another GitHub Actions run.
            # Keep this commit visible to the Cloudflare GitHub integration.
            git commit -m "Auto-update daily lessons"
            if git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying after refreshing ${GITHUB_REF_NAME}..."
            sleep $((attempt * 5))
          done

          echo "Failed to push lesson update after 3 attempts." >&2
          exit 1

      - name: Record saved publishing revision
        id: saved_revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify_publishing:
    name: Verify saved lesson publishing
    defaults:
      run:
        # Explicit bash enables pipefail: tee must not hide a failed verifier.
        shell: bash
    needs: build_and_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # A failed publishing check can be rerun alone, without lesson, image,
      # translation, or page generation. Check the exact commit that was saved.
      - name: Checkout saved publishing revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_and_deploy.outputs.publishing_revision }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package expected public files
        run: node cloudflare/build.cjs

      - name: Wait for Cloudflare publishing
        id: manifest
        timeout-minutes: 14
        run: |
          python cloudflare/verify-publishing.py https://englishladder.philstilwell.workers.dev \
            --report "${RUNNER_TEMP}/publishing-report.json" \
            2>&1 | tee "${RUNNER_TEMP}/publishing-manifest.log"

      - name: Verify current lesson on Cloudflare
        run: |
          node cloudflare/verify-current-lesson.cjs https://englishladder.philstilwell.workers.dev \
            2>&1 | tee "${RUNNER_TEMP}/publishing-current-lesson.log"

      - name: Verify current lesson on public domain
        run: |
          ALLOW_PUBLIC_EDGE_BLOCK=1 node cloudflare/verify-current-lesson.cjs https://englishladder.com \
            2>&1 | tee "${RUNNER_TEMP}/publishing-public-domain.log"

      - name: Retain publishing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publishing-*.json
            ${{ runner.temp }}/publishing-*.log
            .cf-site/deployment.json
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Summarize publishing result
        if: always()
        env:
          PUBLISHING_STATUS: ${{ job.status }}
          PUBLISHING_REVISION: ${{ needs.build_and_deploy.outputs.publishing_revision }}
        run: |
          {
            echo "### Publishing: ${PUBLISHING_STATUS}"
            echo "Saved source revision: ${PUBLISHING_REVISION}"
            echo ""
            echo "Publishing checks use saved content and make no paid generation calls."
            if [ "${PUBLISHING_STATUS}" != "success" ]; then
              echo "Inspect the publishing artifact and the English Ladder Cloudflare build log."
              echo "If Cloudflare exhausted its deployment retries, retry that build for the saved commit, then rerun only the failed publishing job."
              echo "A manual deploy_only=true run can rebuild and verify existing content, but cannot restart a failed Cloudflare build when no files change."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
